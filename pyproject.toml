[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "palfit"
version = "0.1.0"
description = "Fit a physical activity level (PAL) and maintenance calories to a weight log with Hall's adult body-weight model. Pure Python, no dependencies."
readme = "README.md"
authors = [{ name = "112345brian" }]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["energy balance", "body weight", "Hall model", "TDEE", "maintenance calories", "PAL"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
# Dev-only: compiled reference implementation used for the parity tests.
parity = ["pytest>=8", "numpy", "hallmodel"]

[tool.hatch.build.targets.wheel]
packages = ["src/palfit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
